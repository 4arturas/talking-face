<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Google Translate TTS returns 404 when a Referer header is sent -->
<meta name="referrer" content="no-referrer">
<title>Kalbantis veidas</title>
<!--
  PASTABOS
  - Kalba (speechSynthesis) veikia atidarius failą tiesiai per file:// Edge ir Chrome naršyklėse.
  - Mikrofonui (getUserMedia) reikia „saugaus konteksto“. Jei per file:// naršyklė mikrofono
    neleidžia, paleiskite vietinį serverį ir atidarykite per localhost, pvz.:
        python -m http.server 8000      ->  http://localhost:8000/talking-face.html
  - Lietuviškas balsas yra ne visur (Edge dažniausiai turi „Microsoft Ona / Leonas Online“).
    Jei lt-LT balso nėra, naudojamas pirmas galimas balsas ir parodoma pastaba.
-->
<style>
  :root {
    --bg1: #dff3ff;
    --bg2: #fde8ef;
    --accent: #2f7de1;
    --danger: #d9434b;
    --text: #263238;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: grid;
    grid-template-columns: 280px minmax(0, 420px);
    grid-template-areas:
      "left face"
      "left speak";
    gap: 20px;
    justify-content: center;
    align-content: center;
    align-items: start;
    padding: 24px;
  }
  @media (max-width: 760px) {
    body {
      grid-template-columns: minmax(0, 420px);
      grid-template-areas: "face" "left" "speak";
    }
  }
  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .left { grid-area: left; }
  .speak { grid-area: speak; }
  #face {
    grid-area: face;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .15));
  }
  #face:not(.robot) .robot-only, #face.robot .human-only { display: none; }
  #face:not(.girl) .girl-only, #face.girl .boy-only { display: none; }
  #face.robot #eyeL > ellipse, #face.robot #eyeR > ellipse {
    fill: #e6fbff;
    stroke: #346383;
  }
  #face.robot #pupilL circle:first-child, #face.robot #pupilR circle:first-child { fill: #127fa3; }
  #face.robot #browL path, #face.robot #browR path { stroke: #127fa3; }
  #face.robot #mouthOutline { stroke: #156486; }
  #face.robot #mouthFill { fill: #122c49; }
  #face.girl #browL path, #face.girl #browR path { stroke: #5a3043; stroke-width: 6; }
  #face.girl #eyeL > ellipse, #face.girl #eyeR > ellipse { stroke: #5a3043; }
  #face.girl #pupilL circle:first-child, #face.girl #pupilR circle:first-child { fill: #664575; }
  #face.girl #mouthOutline { stroke: #ae4d68; }
  #face.girl #mouthFill { fill: #9c284c; }
  /* Tikroviškas veidas: geometrija (rx, ry, r) keičiama per CSS – veikia Chromium (Edge, Chrome) */
  #face:not(.real) .real-only, #face.real .human-only { display: none; }
  #face.real #eyeL > ellipse, #face.real #eyeR > ellipse, #face.real .eyeClip ellipse {
    rx: 27px; ry: 14px;
  }
  #face.real #eyeL > ellipse, #face.real #eyeR > ellipse { fill: #f3ece7; stroke: #b98572; stroke-width: 1; }
  #face.real #pupilL circle:first-child, #face.real #pupilR circle:first-child { r: 11px; fill: url(#irisGrad); }
  #face.real #pupilL circle:last-child, #face.real #pupilR circle:last-child { r: 2.5px; opacity: .85; }
  #face.real #browL path, #face.real #browR path { stroke: #3d261b; stroke-width: 6; opacity: .85; }
  #face.real #mouthOutline { stroke: #b0605d; stroke-width: 7; }
  #face.real #mouthFill { fill: #3d1416; }
  #face.real #teeth { fill: #f1ebe2; }
  #face.real #tongue { fill: #b9545e; }
  .panel {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 { margin: 0; font-size: 1.3rem; }
  h2 { margin: 0; font-size: 1.05rem; }
  label { font-size: .9rem; font-weight: 600; }
  textarea, select {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid #c7d2da;
    border-radius: 8px;
  }
  textarea { min-height: 90px; resize: vertical; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    flex: 1;
    font: inherit;
    font-weight: 600;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  #micBtn { background: #6a4fc8; }
  #micBtn.active { background: #2e9d5b; }
  #stopBtn { background: var(--danger); }
  .note { font-size: .85rem; min-height: 1.2em; color: #546e7a; }
  .note.warn { color: #b26a00; }
  .meter {
    height: 8px;
    border-radius: 4px;
    background: #e3e9ee;
    overflow: hidden;
    visibility: hidden;
  }
  .meter.on { visibility: visible; }
  #meterBar { height: 100%; width: 0; background: #2e9d5b; }
  .hint { font-size: .8rem; color: #78909c; }
</style>
</head>

<aside class="col left">
<section class="panel">
  <h2>Veidas</h2>

  <label for="faceChoice">Išvaizda</label>
  <select id="faceChoice">
    <option value="human">Žmogus</option>
    <option value="girl">Mergina</option>
    <option value="robot">Robotas</option>
    <option value="real">Tikroviškas veidas</option>

<section class="panel">
  <h2>Balsas</h2>
  <label for="lang">Kalba</label>
  <select id="lang">
    <option value="lt-LT">lt-LT (lietuvių)</option>
    <option value="en-US">en-US (anglų)</option>
  </select>
  <label for="voice">Balsas</label>
  <select id="voice"></select>
  <div id="voiceNote" class="note"></div>
  <div id="speedRow" style="display:flex;align-items:center;gap:8px;margin-top:8px">
    <label for="speed" style="margin:0">Greitis</label>
    <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1" style="flex:1">
    <span id="speedVal" style="min-width:3.5em;text-align:right">1.00×</span>
  </div>
</section>
</aside>

<section class="panel speak">
  <h2>Kalbėjimas</h2>
  <label for="text">Tekstas</label>
  <textarea id="text">Labas! Aš esu kalbantis veidas. Ar girdi mane?</textarea>

  <div class="buttons">
    <button id="speakBtn" type="button">Kalbėk</button>
    <button id="micBtn" type="button">Mikrofonas</button>
    <button id="stopBtn" type="button">Stop</button>
  </div>
  <div id="meter" class="meter"><div id="meterBar"></div></div>
  <div id="status" class="note"></div>
</section>

<script>
'use strict';

const $ = id => document.getElementById(id);
const svg = $('face');
const els = {
  head: $('head'),
  browL: $('browL'), browR: $('browR'),
  mouthFill: $('mouthFill'), mouthOutline: $('mouthOutline'), mouthClip: $('mouthClipPath'),
  teeth: $('teeth'), tongue: $('tongue'),
  status: $('status'), voiceNote: $('voiceNote'),
  meter: $('meter'), meterBar: $('meterBar'), micBtn: $('micBtn')
};

const MOUTH_X = 200, MOUTH_Y = 318;
const RATE = 1;
// Kalbėjimo greitis (0.5–2). Bendras visiems puslapiams ir index.html (antd Slider) per localStorage.
const SPEED_KEY = 'talking-face.speed';
function ttsSpeed() {
  const v = Number(localStorage.getItem(SPEED_KEY));
  return v >= 0.5 && v <= 2 ? v : 1;
}
const MS_PER_CHAR = 72;
const DEFAULT_TEXT = {
  'lt-LT': 'Labas! Aš esu kalbantis veidas. Ar girdi mane?',
  'en-US': 'Hello! I am a talking face. Can you hear me?'
};

// Burnos formos (vizemos): plotis, aukštis, apvalumas 0..1.
const VISEMES = {
  rest: { w: 66, h: 0,  r: .3 },
  a:    { w: 70, h: 44, r: .55 },
  o:    { w: 46, h: 40, r: 1 },
  u:    { w: 34, h: 24, r: 1 },
  e:    { w: 82, h: 26, r: .25 },
  i:    { w: 88, h: 14, r: .1 },
  mbp:  { w: 60, h: 0,  r: .2 },
  fv:   { w: 72, h: 7,  r: .1 },
  cons: { w: 64, h: 16, r: .4 }
};
const VOWELS = new Set(['a', 'o', 'u', 'e', 'i']);

const EYES = [
  { el: $('eyeL'), pupil: $('pupilL'), x: 140, y: 190, off: { x: 0, y: 0 } },
  { el: $('eyeR'), pupil: $('pupilR'), x: 260, y: 190, off: { x: 0, y: 0 } }
];

const mouth = { ...VISEMES.rest };
const state = {
  speaking: false,
  utterance: null,
  frames: [],          // [{t, v}] – vizemų eilė su absoliučiu laiku (ms)
  brows: [],           // [{from, to, type}] – antakių pakėlimai
  mic: null,
  micLevel: 0,
  noise: 0.01,
  mouse: { x: 200, y: 190 },
  lastMouse: -1e9,     // paskutinio pelės judesio laikas
  gaze: { x: 0, y: 0 },// žvilgsnio poslinkis (sakada) nuo pelės ar veido centro
  nextSaccade: performance.now() + 800,
  sway: 0,
  browL: 0, browR: 0,
  nextBlink: performance.now() + 2000 + Math.random() * 4000,
  blinkStart: -1e9
};

/* ---------- Vizemos ---------- */

function visemeFor(ch) {
  // Nuimame diakritikus: ą→a, ė→e, ū→u, š→s ...
  const c = ch.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (c === 'a') return 'a';
  if (c === 'o') return 'o';
  if (c === 'u' || c === 'w') return 'u';
  if (c === 'e') return 'e';
  if (c === 'i' || c === 'y') return 'i';
  if ('mbp'.includes(c)) return 'mbp';
  if ('fv'.includes(c)) return 'fv';
  if (/\p{L}/u.test(c)) return 'cons';
  return null;
}

function charDuration(v) {
  const base = MS_PER_CHAR / (RATE * ttsSpeed());
  return VOWELS.has(v) ? base * 1.35 : base * 0.8;
}

// Teksto atkarpą paverčia laiko eile. withPauses – ar daryti pauzes ties tarpais/skyryba
// (naudojama, kai naršyklė nesiunčia onboundary įvykių ir tenka spėti visą tekstą).
function schedule(text, t0, withPauses) {
  const out = [];
  let t = t0;
  for (const ch of text) {
    const v = visemeFor(ch);
    if (v) {
      out.push({ t, v });
      t += charDuration(v);
    } else if (withPauses) {
      if (ch === '?' || ch === '!') addBrow(ch, t);
      const pause = /[.,;:?!…]/.test(ch) ? 260 : (/\s/.test(ch) ? 60 : 0);
      if (pause) {
        out.push({ t, v: 'rest' });
        t += pause / (RATE * ttsSpeed());
      }
    }
  }
  out.push({ t, v: 'rest' });
  return out;
}

function visemeAt(now) {
  let v = 'rest';
  for (const f of state.frames) {
    if (f.t > now) break;
    v = f.v;
  }
  return VISEMES[v];
}

function addBrow(type, from) {
  state.brows.push({ type, from, to: from + 900 });
}

// Žodžio riba: suplanuojame tik šį žodį nuo dabar, taip sinchronizacija atsistato kiekvienam žodžiui.
function onWord(text, index, length) {
  const rest = text.slice(index);
  const match = rest.match(/^[\p{L}\p{N}'’-]+/u);
  const word = length ? text.substr(index, length) : (match ? match[0] : rest.split(/\s/)[0]);
  const now = performance.now();
  state.frames = schedule(word, now, false);
  const wordDur = state.frames[state.frames.length - 1].t - now;
  const after = (text.slice(index + word.length).match(/^[^\p{L}\p{N}]*/u) || [''])[0];
  const punct = word + after;
  if (/[?!]/.test(punct)) addBrow(punct.includes('?') ? '?' : '!', now + wordDur * 0.6);
}

/* ---------- Kalba ---------- */

function pickVoice(lang) {
  const voices = speechSynthesis.getVoices();
  const norm = s => s.replace('_', '-').toLowerCase();
  const prefix = lang.slice(0, 2).toLowerCase();
  const voice = voices.find(v => norm(v.lang) === lang.toLowerCase())
    || voices.find(v => norm(v.lang).startsWith(prefix));
  if (voice) return { voice, fallback: false };
  return { voice: voices[0] || null, fallback: true };
}

function setNote(el, text, warn) {
  el.textContent = text;
  el.classList.toggle('warn', !!warn);
}

/* ---------- Balso pasirinkimas ---------- */
// Vietinio serverio balsai ateina iš /api/voices (Piper „Aistė", Edge „Ona"/„Leonas", anglų Edge).
// Prie jų pridedami šios naršyklės balsai ir Google. Pasirinkimas saugomas kiekvienai kalbai atskirai.
const VOICE_KEY = 'talking-face.voice.';
const voiceState = { server: null, list: [], leadMs: 0 };
const sameLang = (a, b) => String(a || '').replace('_', '-').toLowerCase().slice(0, 2)
  === String(b || '').toLowerCase().slice(0, 2);

async function loadServerVoices() {
  try {
    const r = await fetch(`${ttsBase()}/api/voices`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    voiceState.list = [...(data.piper || []), ...(data.edge || [])];
    voiceState.leadMs = Number(data.leadMs) || 0;
    voiceState.server = true;
  } catch {
    voiceState.list = [];
    voiceState.server = false;
  }
  fillVoices();
}

function fillVoices() {
  const lang = $('lang').value;
  const sel = $('voice');
  const saved = localStorage.getItem(VOICE_KEY + lang) || 'auto';
  sel.innerHTML = '';
  const add = (parent, value, text) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    parent.appendChild(o);
  };
  const group = text => {
    const g = document.createElement('optgroup');
    g.label = text;
    sel.appendChild(g);
    return g;
  };
  add(sel, 'auto', 'Automatiškai');
  const server = voiceState.list.filter(v => sameLang(v.lang, lang));
  if (server.length) {
    const g = group('Vietinis serveris');
    server.forEach(v => add(g, v.id === 'piper' ? 'piper' : `edge:${v.id}`, v.label));
  }
  const native = 'speechSynthesis' in window
    ? speechSynthesis.getVoices().filter(v => sameLang(v.lang, lang)) : [];
  if (native.length) {
    const g = group('Naršyklės balsai');
    native.forEach(v => add(g, `native:${v.name}`, `${v.name} (${v.lang})`));
  }
  add(group('Internetas'), 'google', 'Google Translate (online)');
  sel.value = [...sel.options].some(o => o.value === saved) ? saved : 'auto';
  describeVoice();
}

function chosenVoiceLabel() {
  const o = $('voice').selectedOptions[0];
  return o ? o.textContent : '';
}

// Ištaria tekstą pasirinktu balsu. Jei vietinis serveris nepasiekiamas –
// naršyklės balsas, kitaip Google (fallbackVoice).
function speakChosen(text, onDone) {
  const lang = $('lang').value;
  const choice = $('voice').value || 'auto';
  if (choice === 'google') return speakGoogle(text, lang, onDone);
  if (choice.startsWith('native:')) {
    const v = 'speechSynthesis' in window
      ? speechSynthesis.getVoices().find(x => x.name === choice.slice(7)) : null;
    return v ? speakNative(text, lang, v, onDone) : fallbackVoice(text, lang, onDone);
  }
  if (choice === 'piper') {
    return speakLocal(text, lang, onDone, fallbackVoice, 'engine=piper', chosenVoiceLabel());
  }
  if (choice.startsWith('edge:')) {
    return speakLocal(text, lang, onDone, fallbackVoice,
      `engine=edge&voice=${encodeURIComponent(choice.slice(5))}`, chosenVoiceLabel());
  }
  // Automatiškai: lietuviškai Piper → Edge „Ona"; kitai kalbai – pirmas tos kalbos Edge balsas
  // (Piper balsas tik lietuviškas).
  if (sameLang(lang, 'lt')) return speakLocal(text, lang, onDone, fallbackVoice);
  const edge = voiceState.list.find(v => v.id !== 'piper' && sameLang(v.lang, lang));
  if (!edge) return fallbackVoice(text, lang, onDone);
  speakLocal(text, lang, onDone, fallbackVoice,
    `engine=edge&voice=${encodeURIComponent(edge.id)}`, edge.label);
}

function describeVoice() {
  const lang = $('lang').value;
  const choice = $('voice').value || 'auto';
  const { voice, fallback } = pickVoice(lang);
  const nativeText = voice && !fallback ? `naršyklės „${voice.name}"` : 'naršyklės balsas';
  let text;
  if (choice === 'auto') {
    text = sameLang(lang, 'lt')
      ? `Tvarka: vietinis serveris (Piper „Aistė" → Edge „Ona") → ${nativeText} → Google.`
      : `Tvarka: vietinis serveris (Edge) → ${nativeText} → Google.`;
  } else if (choice === 'google') {
    text = 'Google Translate: tekstas siunčiamas Google.';
  } else if (choice.startsWith('native:')) {
    text = 'Naršyklės balsas, be serverio.';
  } else {
    text = '';
  }
  const down = voiceState.server === false;
  if (down) text += ' Vietinis balsų serveris nepasiekiamas (paleisk: npm start).';
  setNote($('voiceNote'), text, down);
}

// Google Translate TTS (neoficialus): naudojamas, kai naršyklė neturi balso pasirinktai kalbai.
// Tekstas siunčiamas Google. Vienai užklausai – iki ~200 simbolių, todėl tekstą skaidome.
const GOOGLE_TTS_MAX = 190;

// Vietinis balsų serveris (server.mjs): Piper „Aistė" (offline) arba
// edge-tts (Microsoft „Ona"/„Leonas", online). Per localhost:3000 nuoroda paprasta,
// kitaip – absoliuti, kad veiktų ir iš python http.server / file://.
const TTS_PORT = 3000;
function ttsBase() {
  const port = location.port || (location.protocol === 'https:' ? 443 : 80);
  return Number(port) === TTS_PORT ? '' : `http://localhost:${TTS_PORT}`;
}

function splitForTts(text) {
  const parts = [];
  let rest = text.trim();
  while (rest.length > GOOGLE_TTS_MAX) {
    const head = rest.slice(0, GOOGLE_TTS_MAX);
    let cut = Math.max(head.lastIndexOf('. '), head.lastIndexOf('! '), head.lastIndexOf('? '), head.lastIndexOf(', '));
    if (cut < GOOGLE_TTS_MAX / 3) cut = head.lastIndexOf(' ');
    if (cut <= 0) cut = GOOGLE_TTS_MAX - 1;
    parts.push(rest.slice(0, cut + 1).trim());
    rest = rest.slice(cut + 1).trim();
  }
  if (rest) parts.push(rest);
  return parts;
}

function speakGoogle(text, lang, onDone) {
  const token = {};
  const parts = splitForTts(text);
  state.utterance = token;

  const finish = error => {
    if (state.utterance !== token) return;
    state.speaking = false;
    state.frames = [];
    state.utterance = null;
    state.audio = null;
    setNote(els.status, error ? `Google TTS klaida: ${error}` : 'Baigta.', !!error);
    if (onDone) onDone();
  };

  const playPart = i => {
    if (state.utterance !== token) return;
    if (i >= parts.length) return finish();
    const part = parts[i];
    const audio = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob'
      + `&tl=${encodeURIComponent(lang.slice(0, 2))}&q=${encodeURIComponent(part)}`);
    const speed = ttsSpeed();
    audio.playbackRate = speed;   // tonas išlieka (preservesPitch)
    state.audio = audio;
    audio.onplaying = () => {
      if (state.utterance !== token) return;
      const now = performance.now();
      const frames = schedule(part, now, true);
      const estimated = frames[frames.length - 1].t - now;
      const actual = (audio.duration || 0) * 1000 / speed;
      const k = estimated > 0 && actual > 0 && isFinite(actual) ? actual / estimated : 1;
      frames.forEach(f => { f.t = now + (f.t - now) * k; });
      state.frames = frames;
      state.speaking = true;
      setNote(els.status, 'Kalbu… (Google TTS)', false);
    };
    audio.onended = () => playPart(i + 1);
    audio.onerror = () => finish('nepavyko gauti garso (ar yra internetas?)');
    audio.play().catch(e => finish(e.message));
  };
  playPart(0);
}

// Vietinis balsas: serveris bando Piper (offline), tada edge-tts (Ona). Jei ir tai
// nepavyksta arba serveris nepasiekiamas – kviečiamas fallback (naršyklės balsas, kitaip Google).
function speakLocal(text, lang, onDone, fallback, query = 'engine=auto', label = 'Piper / Edge') {
  const token = {};
  const parts = splitForTts(text);
  state.utterance = token;

  const finish = error => {
    if (state.utterance !== token) return;
    state.speaking = false;
    state.frames = [];
    state.utterance = null;
    state.audio = null;
    setNote(els.status, error ? `Vietinio TTS klaida: ${error}` : 'Baigta.', !!error);
    if (onDone) onDone();
  };

  const playPart = i => {
    if (state.utterance !== token) return;
    if (i >= parts.length) return finish();
    const part = parts[i];
    const audio = new Audio(`${ttsBase()}/api/tts?${query}&speed=${ttsSpeed()}&text=${encodeURIComponent(part)}`);
    state.audio = audio;
    audio.onplaying = () => {
      if (state.utterance !== token) return;
      // Serveris prideda leadMs tylos pradžioje (BT ausinės nukerpa pradžią) – lūpos laukia tiek pat.
      const lead = voiceState.leadMs;
      const start = performance.now() + lead;
      const frames = schedule(part, start, true);
      const estimated = frames[frames.length - 1].t - start;
      const actual = (audio.duration || 0) * 1000 - lead;
      const k = estimated > 0 && actual > 0 && isFinite(actual) ? actual / estimated : 1;
      frames.forEach(f => { f.t = start + (f.t - start) * k; });
      state.frames = frames;
      state.speaking = true;
      setNote(els.status, `Kalbu… (${label})`, false);
    };
    audio.onended = () => playPart(i + 1);
    const fall = () => {
      if (state.utterance !== token) return;
      state.audio = null;
      (fallback || speakGoogle)(text, lang, onDone);
    };
    audio.onerror = fall;
    audio.play().catch(fall);
  };
  playPart(0);
}

// Naršyklės (natyvus) balsas.
function speakNative(text, lang, voice) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  if (voice) u.voice = voice;
  u.rate = RATE * ttsSpeed();

  // Senos (atšauktos) frazės įvykiai ignoruojami.
  u.onstart = () => {
    if (state.utterance !== u) return;
    state.speaking = true;
    state.frames = schedule(text, performance.now(), true);
    setNote(els.status, 'Kalbu…', false);
  };
  u.onboundary = e => {
    if (state.utterance !== u || (e.name && e.name !== 'word')) return;
    state.brows = state.brows.filter(b => b.from <= performance.now());
    onWord(text, e.charIndex, e.charLength);
  };
  u.onend = u.onerror = e => {
    if (state.utterance !== u) return;
    state.speaking = false;
    state.frames = [];
    state.utterance = null;
    const failed = e.type === 'error' && e.error !== 'interrupted' && e.error !== 'canceled';
    setNote(els.status, failed ? `Kalbos klaida: ${e.error}` : 'Baigta.', failed);
  };

  state.utterance = u;   // laikome nuorodą, kad Chrome nesurinktų jos kaip šiukšlės
  speechSynthesis.speak(u);
}

// Kada vietinis serveris nepasiekiamas: natyvus naršyklės balsas, kitaip – Google.
function fallbackVoice(text, lang) {
  const { voice } = pickVoice(lang);
  if (voice) return speakNative(text, lang, voice);
  speakGoogle(text, lang);
}

// Bluetooth adapteris (pvz. Poly BT700) po tylos užmiega ir nukerpa pirmą frazę.
// Kol puslapis atidarytas, groja beveik negirdimą triukšmą (~-80 dB), kad garso įrenginys nemiegotų.
let awakeCtx = null;
let awakeSince = 0;
function keepAudioAwake() {
  try {
    if (!awakeCtx) {
      awakeCtx = new AudioContext(); awakeSince = performance.now();
      awakeCtx.onstatechange = () => { if (awakeCtx.state === 'running') awakeSince = performance.now(); };
      const rate = awakeCtx.sampleRate;
      const buf = awakeCtx.createBuffer(1, rate, rate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 1e-4;
      const src = awakeCtx.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      src.connect(awakeCtx.destination);
      src.start();
    }
    if (awakeCtx.state !== 'running') awakeCtx.resume().catch(() => {});
  } catch {}
}
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, keepAudioAwake, true);
keepAudioAwake();   // be paspaudimo pasileidžia tik su npm run show

function speak() {
  keepAudioAwake();
  // Įrenginys ką tik pažadintas – palaukiam, kol užsikurs ryšys, kitaip pirma frazė nukerpama.
  const sinceAwake = performance.now() - awakeSince;
  if (awakeCtx && awakeCtx.state === 'running' && sinceAwake < 800) {
    setTimeout(speak, 800 - sinceAwake);
    return;
  }
  const text = $('text').value.trim();
  if (!text) return;
  stopMic();
  stopSpeech();
  speakChosen(text);
}

function stopSpeech() {
  state.utterance = null;
  state.speaking = false;
  state.frames = [];
  if (state.audio) { state.audio.pause(); state.audio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

/* ---------- Mikrofonas ---------- */

async function toggleMic() {
  if (state.mic) {
    stopMic();
    setNote(els.status, 'Mikrofonas išjungtas.', false);
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setNote(els.status, 'Mikrofonas nepasiekiamas. Atidarykite per http://localhost.', true);
    return;
  }
  stopSpeech();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true }
    });
    const ctx = new AudioContext();
    await ctx.resume();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    ctx.createMediaStreamSource(stream).connect(analyser);
    state.mic = { stream, ctx, analyser, buf: new Float32Array(analyser.fftSize) };
    state.noise = 0.01;
    els.micBtn.classList.add('active');
    els.micBtn.textContent = 'Mikrofonas (įj.)';
    els.meter.classList.add('on');
    setNote(els.status, 'Klausau mikrofono…', false);
  } catch (err) {
    setNote(els.status, `Mikrofono įjungti nepavyko (${err.name}). Per file:// gali reikėti localhost.`, true);
  }
}

function stopMic() {
  const m = state.mic;
  if (!m) return;
  m.stream.getTracks().forEach(t => t.stop());
  m.ctx.close();
  state.mic = null;
  els.micBtn.classList.remove('active');
  els.micBtn.textContent = 'Mikrofonas';
  els.meter.classList.remove('on');
}

function updateMic(dt) {
  const m = state.mic;
  if (!m) {
    state.micLevel += (0 - state.micLevel) * (1 - Math.exp(-dt * 8));
    return;
  }
  m.analyser.getFloatTimeDomainData(m.buf);
  let sum = 0;
  for (const x of m.buf) sum += x * x;
  const rms = Math.sqrt(sum / m.buf.length);

  // Triukšmo lygis greitai krinta ir lėtai kyla, todėl foninis ūžesys burnos neatidaro.
  state.noise = rms < state.noise ? rms : state.noise + (rms - state.noise) * dt * 0.3;
  const raw = Math.min(1, Math.max(0, (rms - state.noise * 1.6 - 0.004) * 18));

  // Asimetrinis lyginimas: greitai atsidaro, lėčiau užsidaro – burna nedreba.
  const k = raw > state.micLevel ? 1 - Math.exp(-dt * 30) : 1 - Math.exp(-dt * 9);
  state.micLevel += (raw - state.micLevel) * k;
  els.meterBar.style.width = `${Math.round(state.micLevel * 100)}%`;
}

/* ---------- Piešimas ---------- */

const f1 = n => n.toFixed(1);

function drawMouth() {
  const { w, h, r } = mouth;
  const x0 = MOUTH_X - w / 2, x1 = MOUTH_X + w / 2;
  const yc = MOUTH_Y - Math.max(0, 6 - h * 0.12);     // kampučiai pakelti – lengva šypsena
  const up = h * 0.35, down = h * 0.65 + 1.5;
  const c = 0.25 * (1 - r) * w;                       // mažesnis c – apvalesnė burna
  const k = 1.33;                                     // Bezier koef. pusės elipsės aproksimacijai
  const d = `M${f1(x0)} ${f1(yc)} C${f1(x0 + c)} ${f1(MOUTH_Y - up * k)} ${f1(x1 - c)} ${f1(MOUTH_Y - up * k)} ${f1(x1)} ${f1(yc)}`
          + ` C${f1(x1 - c)} ${f1(MOUTH_Y + down * k)} ${f1(x0 + c)} ${f1(MOUTH_Y + down * k)} ${f1(x0)} ${f1(yc)}Z`;
  els.mouthFill.setAttribute('d', d);
  els.mouthOutline.setAttribute('d', d);
  els.mouthClip.setAttribute('d', d);

  const tw = w * 0.8;
  els.teeth.setAttribute('x', f1(MOUTH_X - tw / 2));
  els.teeth.setAttribute('y', f1(MOUTH_Y - up - 3));
  els.teeth.setAttribute('width', f1(tw));
  els.teeth.setAttribute('height', '9');
  els.teeth.setAttribute('opacity', h > 6 ? 1 : 0);

  els.tongue.setAttribute('cx', MOUTH_X);
  els.tongue.setAttribute('cy', f1(MOUTH_Y + down - 2));
  els.tongue.setAttribute('rx', f1(w * 0.32));
  els.tongue.setAttribute('ry', f1(4 + h * 0.12));
  els.tongue.setAttribute('opacity', h > 10 ? 1 : 0);
}

function updateEyes(now, dt) {
  if (now >= state.nextBlink) {
    state.blinkStart = now;
    state.nextBlink = now + 2000 + Math.random() * 4000;
  }
  const p = (now - state.blinkStart) / 170;
  const s = p >= 0 && p < 1 ? 1 - 0.95 * Math.sin(Math.PI * p) : 1;
  // Kai pelė nejuda >2,5 s, akys pačios dairosi: staigūs šuoliai (sakados) į atsitiktinius taškus,
  // dažnai grįžtant žiūrėti tiesiai į žiūrovą. Kai pelė juda – tik maži virpesiai aplink ją.
  const idle = now - state.lastMouse > 2500;
  if (now >= state.nextSaccade) {
    state.nextSaccade = now + 500 + Math.random() * 2500;
    const lookAtViewer = idle && Math.random() < 0.4;
    state.gaze.x = lookAtViewer ? 0 : (Math.random() - 0.5) * (idle ? 380 : 40);
    state.gaze.y = lookAtViewer ? 0 : (Math.random() - 0.5) * (idle ? 220 : 24);
  }
  const gx = (idle ? 200 : state.mouse.x) + state.gaze.x;
  const gy = (idle ? 190 : state.mouse.y) + state.gaze.y;
  const kp = 1 - Math.exp(-dt * (idle ? 16 : 4));

  for (const e of EYES) {
    const dx = gx - e.x, dy = gy - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    const reach = Math.min(1, dist / 180);
    e.off.x += (dx / dist * 9 * reach - e.off.x) * kp;
    e.off.y += (dy / dist * 7 * reach - e.off.y) * kp;
    e.pupil.setAttribute('transform', `translate(${f1(e.off.x)} ${f1(e.off.y)})`);
    // Suspaudimas aplink akies centrą: y' = s*y + cy*(1-s)
    e.el.setAttribute('transform', `translate(0 ${(e.y * (1 - s)).toFixed(2)}) scale(1 ${s.toFixed(3)})`);
  }
}

function updateBrows(now, dt) {
  state.brows = state.brows.filter(b => now < b.to);
  let tl = 0, tr = 0;
  for (const b of state.brows) {
    if (now < b.from) continue;
    if (b.type === '?') { tl = Math.min(tl, -14); tr = Math.min(tr, -6); }
    else { tl = Math.min(tl, -12); tr = Math.min(tr, -12); }
  }
  tl -= state.micLevel * 4;
  tr -= state.micLevel * 4;
  const kb = 1 - Math.exp(-dt * 10);
  state.browL += (tl - state.browL) * kb;
  state.browR += (tr - state.browR) * kb;
  els.browL.setAttribute('transform', `translate(0 ${f1(state.browL)})`);
  els.browR.setAttribute('transform', `translate(0 ${f1(state.browR)})`);
}

function updateHead(now, dt) {
  const active = state.speaking || state.micLevel > 0.06;
  state.sway += ((active ? 1 : 0) - state.sway) * (1 - Math.exp(-dt * 3));
  const t = now / 1000;
  const rot = state.sway * (Math.sin(t * 2.3) * 2.6 + Math.sin(t * 3.9) * 1.2);
  const bob = state.sway * Math.sin(t * 4.6) * 2 + Math.sin(t * 1.1) * 0.8;   // + lengvas „kvėpavimas“
  els.head.setAttribute('transform', `rotate(${rot.toFixed(2)} 200 420) translate(0 ${bob.toFixed(2)})`);
}

let lastTime = performance.now();
function tick(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;

  updateMic(dt);
  let target = VISEMES.rest;
  if (state.speaking) target = visemeAt(now);
  else if (state.mic) target = { w: 62 + state.micLevel * 16, h: state.micLevel * 48, r: .55 };

  // Tolygus perėjimas į tikslinę formą
  const km = 1 - Math.exp(-dt * 22);
  for (const key of ['w', 'h', 'r']) mouth[key] += (target[key] - mouth[key]) * km;

  drawMouth();
  updateEyes(now, dt);
  updateBrows(now, dt);
  updateHead(now, dt);
  requestAnimationFrame(tick);
}

/* ---------- Įvykiai ---------- */

window.addEventListener('mousemove', e => {
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const p = pt.matrixTransform(ctm.inverse());
  state.mouse.x = p.x;
  state.mouse.y = p.y;
  state.lastMouse = performance.now();
});

$('speakBtn').addEventListener('click', speak);
// Tekstas iš serverio failo say.txt (SSE, /api/say/events): failui pasikeitus avataras jį ištaria.
// Naršyklė leidžia garsą tik po vartotojo paspaudimo, todėl iki tol tekstas laukia.
let pendingSay = null;
// Ar naršyklė leidžia garsą be paspaudimo (pvz. paleista per npm run show)? Bandome tylų garsą.
async function canPlaySound() {
  if (navigator.userActivation && navigator.userActivation.hasBeenActive) return true;
  try {
    const a = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAACAgICA');
    a.volume = 0;
    await a.play();
    return true;
  } catch (e) {
    return e.name !== 'NotAllowedError';
  }
}
async function sayFromServer(text) {
  $('text').value = text;
  if (!(await canPlaySound())) {
    pendingSay = text;
    setNote($('status'), 'Gautas tekstas iš say.txt. Spustelėk puslapį – tada ištarsiu (be paspaudimo: npm run show).', true);
    return;
  }
  pendingSay = null;
  speak();
}
document.addEventListener('pointerdown', e => {
  if (pendingSay === null) return;
  pendingSay = null;
  if (e.target.closest('#speakBtn')) return;
  setTimeout(speak, 0);
});
// say.txt taria tik aktyvus puslapis. Serveris tekstą siunčia tik tam klientui, kuris paskutinis
// pranešė, kad yra aktyvus (veikia tarp tabų, langų ir skirtingų naršyklių).
const PAGE_ID = Math.random().toString(36).slice(2);
function isShown() {
  if (document.visibilityState !== 'visible') return false;
  try {
    const f = window.frameElement;
    if (f && !f.getClientRects().length) return false;
  } catch {}
  return true;
}
let lastActiveSent = 0;
function markActive() {
  if (!isShown() || location.protocol === 'file:') return;
  const now = Date.now();
  if (now - lastActiveSent < 500) return;
  lastActiveSent = now;
  fetch(`${ttsBase()}/api/say/active?id=${PAGE_ID}`, { method: 'POST', keepalive: true }).catch(() => {});
}
for (const ev of ['focus', 'pointerdown', 'pageshow']) addEventListener(ev, markActive, true);
document.addEventListener('visibilitychange', markActive);
if ('EventSource' in window && location.protocol !== 'file:') {
  const es = new EventSource(`${ttsBase()}/api/say/events?id=${PAGE_ID}`);
  // prisijungus (ir po serverio perkrovimo) aktyvus tas puslapis, kuris turi fokusą
  es.addEventListener('open', () => { if (document.hasFocus()) { lastActiveSent = 0; markActive(); } });
  es.addEventListener('say', e => {
    const { text } = JSON.parse(e.data);
    if (text && isShown()) sayFromServer(text);
  });
}
$('micBtn').addEventListener('click', toggleMic);
$('faceChoice').addEventListener('change', e => {
  svg.classList.toggle('robot', e.target.value === 'robot');
  svg.classList.toggle('girl', e.target.value === 'girl');
  svg.classList.toggle('real', e.target.value === 'real');
});
$('stopBtn').addEventListener('click', () => {
  stopSpeech();
  stopMic();
  state.brows = [];
  setNote(els.status, 'Sustabdyta.', false);
});
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); speak(); }
});
$('lang').addEventListener('change', () => {
  const ta = $('text');
  if (Object.values(DEFAULT_TEXT).includes(ta.value.trim())) ta.value = DEFAULT_TEXT[$('lang').value];
  fillVoices();
});

// Greičio slankiklis. Index.html viduje jį rodo antd Slider viršuje, todėl čia paslepiamas.
function showSpeed() {
  const v = ttsSpeed();
  $('speed').value = v;
  $('speedVal').textContent = `${v.toFixed(2)}×`;
}
if (window.top !== window) $('speedRow').style.display = 'none';
showSpeed();
$('speed').addEventListener('input', () => {
  localStorage.setItem(SPEED_KEY, $('speed').value);
  showSpeed();
});
window.addEventListener('storage', e => { if (e.key === SPEED_KEY) showSpeed(); });

$('voice').addEventListener('change', () => {
  localStorage.setItem(VOICE_KEY + $('lang').value, $('voice').value);
  describeVoice();
});
if ('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', fillVoices);
fillVoices();
loadServerVoices();
drawMouth();
requestAnimationFrame(tick);
</script>
